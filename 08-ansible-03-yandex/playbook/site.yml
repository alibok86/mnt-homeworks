---
- name: Install Clickhouse
  hosts: clickhouse-01
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Get clickhouse distrib
      block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
            mode: "0644"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"
            mode: "0644"
    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - ./clickhouse-common-static-{{ clickhouse_version }}.rpm
          - ./clickhouse-client-{{ clickhouse_version }}.rpm
          - ./clickhouse-server-{{ clickhouse_version }}.rpm
        disable_gpg_check: true
      notify: Start clickhouse service
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'CREATE DATABASE IF NOT EXISTS logs'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install Vector
  hosts: clickhouse-02
  handlers:
    - name: Start Vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
  tasks:
    - name: Download vector packages
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
        dest: "./vector-{{ vector_version }}-1.x86_64.rpm"
        mode: "0644"
    - name: Install vector packages
      become: true
      ansible.builtin.yum:
        name: "./vector-{{ vector_version }}-1.x86_64.rpm"
        disable_gpg_check: true
    - name: Apply vector template
      become: true
      ansible.builtin.template:
        src: vector.yml.j2
        dest: "{{ vector_config_dir }}/vector.yml"
        mode: "0644"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        validate: vector validate --no-environment --config-yaml %s
    - name: Change vector systemd unit
      ansible.builtin.template:
        src: "templates/vector.service.j2"
        dest: "/usr/lib/systemd/system/vector.service"
        mode: "0644"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid }}"
        backup: true
      notify: Start Vector service

- name: Install Lighthouse on CentOS 7
  hosts: lighthouse_yandex
  become: true
  vars:
    lighthouse_dir: "/var/www/lighthouse"
    nginx_conf_dir: "/etc/nginx/conf.d"

  tasks:
    - name: Install EPEL repository
      yum:
        name: epel-release
        state: present
      tags: lighthouse

    - name: Install dependencies
      yum:
        name: "{{ item }}"
        state: present
        update_cache: yes
      with_items:
        - nginx
        - git
      tags: lighthouse

    - name: Remove default nginx configuration
      file:
        path: "{{ nginx_conf_dir }}/default.conf"
        state: absent
      tags: lighthouse

    - name: Upload Lighthouse nginx config
      template:
        src: templates/lighthouse.conf.j2
        dest: "{{ nginx_conf_dir }}/lighthouse.conf"
        mode: 0644
      tags: lighthouse

    - name: Create web directory for Lighthouse
      file:
        path: "{{ lighthouse_dir }}"
        state: directory
        owner: nginx
        group: nginx
        mode: 0755
      tags: lighthouse

    - name: Clone Lighthouse repository
      git:
        repo: https://github.com/VKCOM/lighthouse.git
        dest: "{{ lighthouse_dir }}"
        version: master
      tags: lighthouse

    - name: Set proper permissions
      file:
        path: "{{ lighthouse_dir }}"
        state: directory
        owner: nginx
        group: nginx
        recurse: yes
      tags: lighthouse

    - name: Configure SELinux for web directory
      seboolean:
        name: httpd_read_user_content
        state: yes
        persistent: yes
      when: ansible_selinux.status == "enabled"
      tags: lighthouse

    - name: Enable and restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
      tags: lighthouse